# Third-party files (font licence, generated API types) stay byte-for-byte as published.
exclude: ^(web/src/fonts/|web/src/lib/api/schema\.d\.ts$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=600"]
      - id: detect-private-key
  # Full secret scanning (gitleaks) runs in CI; its pre-commit hook needs a Go toolchain.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
