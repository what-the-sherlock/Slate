name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Layer rules
        run: uv run lint-imports
      - name: Unit and contract tests (no network)
        run: uv run pytest -m "not integration"
      - name: OpenAPI is committed and current
        run: uv run python scripts/export_openapi.py --check
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API client matches openapi.json
        run: pnpm gen:api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    # Runs against the Neon *test* branch. Only on main, or on PRs labelled "db",
    # to stay inside Neon's compute budget.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'db')
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: neon-test-branch
      cancel-in-progress: false
    env:
      ENV: test
      SLATE_ALLOW_DESTRUCTIVE_TESTS: "1"  # dedicated test branch
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_TEST_DIRECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrate the test branch
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -m integration
