[project]
name = "slate"
version = "0.1.0"
description = "Permission-aware knowledge assistant with hybrid search and cited answers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.3.9",
    "pgvector>=0.3",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.28",
    "tenacity>=9.0",
    "sse-starlette>=2.1",
    "uvicorn>=0.32",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "tiktoken>=0.8",
    "openai>=1.55",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "hypothesis>=6.120",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "boto3-stubs[s3]>=1.35",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
# Not a distributable library: the repo root is on sys.path for every entry point.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "docs", "*.md", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "PT", "RUF", "TID", "N", "C4", "PTH"]
ignore = [
    "S101",  # assert is fine; tests use it and runtime code does not rely on it
    "N818",  # error names follow CONVENTIONS.md (NotFound, PermissionDenied...), not *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # fake secrets and non-crypto randomness are fine in tests
"tests/integration/**" = ["E501"]  # long SQL literals read better unwrapped
"scripts/**" = ["S311"]
# The provider registry: public endpoint URLs and enum labels named "token", not secrets.
"core/domain/integrations.py" = ["S105", "S106"]
# Rule 6: each vendor SDK is allowed only inside its own adapter (and that adapter's tests).
"core/adapters/s3/**" = ["TID251"]
"core/adapters/openai/**" = ["TID251"]
"tests/unit/core/adapters/s3/**" = ["TID251", "S105", "S106"]
"tests/unit/core/adapters/test_openai_embedder.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Rule 6: vendor SDKs live only in adapters (adapters re-allow via per-file-ignores when added).
"openai".msg = "Import the OpenAI SDK only in core/adapters/openai/"
"boto3".msg = "Import boto3 only in core/adapters/s3/"
"botocore".msg = "Import botocore only in core/adapters/s3/"

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "worker", "evals"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
pythonVersion = "3.12"
include = ["api", "core", "worker", "evals", "tests", "scripts", "migrations"]
exclude = ["**/__pycache__", "web", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "warning"
executionEnvironments = [
    { root = "core", extraPaths = ["."] },
    { root = "." },
]
strict = ["core"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1"  # loopback only (asyncio on Windows needs a local socketpair)
markers = [
    "integration: needs DATABASE_URL pointing at a Neon test branch (network allowed)",
    "contract: API/event contract snapshots",
]
filterwarnings = [
    "error::DeprecationWarning:core.*",
    # upstream: starlette nudges TestClient users towards httpx2; harmless for us
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["api", "core", "worker", "evals"]
include_external_packages = true  # needed to forbid sqlalchemy/fastapi/httpx in pure layers

[[tool.importlinter.contracts]]
name = "Layers: entry points -> services -> ports -> domain"
type = "layers"
layers = [
    "api | worker | evals",
    "core.services",
    "core.ports",
    "core.domain",
]
ignore_imports = [
    "api.deps -> core.adapters.**",
    "api.dev -> core.adapters.**",  # dev-only: selects the Windows event loop
    "worker.main -> core.adapters.**",
    "evals.load -> core.adapters.**",
    "evals.run -> core.adapters.**",
    "evals.answers -> core.adapters.**",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["core.domain"]
forbidden_modules = ["core.ports", "core.services", "core.adapters", "core.config", "api", "worker", "evals", "sqlalchemy", "fastapi", "httpx"]

[[tool.importlinter.contracts]]
name = "Services never import adapters"
type = "forbidden"
source_modules = ["core.services", "core.ports"]
forbidden_modules = ["core.adapters", "sqlalchemy", "fastapi"]

# Composition roots (api.deps, worker.main, evals.load, evals.run) are the only modules
# allowed to import core.adapters.
[[tool.importlinter.contracts]]
name = "Only composition roots import adapters"
type = "forbidden"
source_modules = ["api", "worker", "evals"]
forbidden_modules = ["core.adapters"]
ignore_imports = [
    "api.deps -> core.adapters.**",
    "api.dev -> core.adapters.**",  # dev-only: selects the Windows event loop
    "worker.main -> core.adapters.**",
    "evals.load -> core.adapters.**",
    "evals.run -> core.adapters.**",
    "evals.answers -> core.adapters.**",
]
allow_indirect_imports = true
